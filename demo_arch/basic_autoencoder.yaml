input_dim: [3, 128, 128]
encoder_layers:
  - dim: 2
    in_channels: 3
    out_channels: 16
    kernel_size: 3
    activation: "GELU"
    downsample_method: "max"
  - dim: 2
    in_channels: 16
    out_channels: 32
    kernel_size: 3
    activation: "GELU"
    downsample_method: "avg"
  - dim: 2
    in_channels: 32
    out_channels: 64
    kernel_size: 3
    activation: "GELU"
    downsample_method: "max"
decoder_layers:
  - dim: 2
    in_channels: 64
    out_channels: 32
    kernel_size: 3
    activation: "GELU"
    upsample_method: "nearest"
  - dim: 2
    in_channels: 32
    out_channels: 16
    kernel_size: 3
    activation: "GELU"
    upsample_method: "bilinear"
  - dim: 2
    in_channels: 16
    out_channels: 3
    kernel_size: 3
    activation: "Sigmoid"
    upsample_method: "nearest"
activation: "GELU"
norm: "group"