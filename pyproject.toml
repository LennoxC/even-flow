[project]
authors = [{name = "lennoxc", email = "lennoxcrowe16@gmail.com"}]
dependencies = []
name = "even-flow"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.feature.gpu.system-requirements]
cuda = "12.8"

[tool.pixi.environments]
gpu = ["gpu"]
default = ["cpu"]

[tool.pixi.pypi-dependencies]
even_flow = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.feature.cpu.dependencies]
pytorch-cpu = ">=2.9.1,<3"

[tool.pixi.feature.gpu.dependencies]
cuda-version = "12.8.*"
pytorch-gpu = "*"
